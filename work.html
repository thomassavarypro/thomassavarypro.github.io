<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Thomas Marcucci | Work</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;800&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; padding: 0; 
            background: #000; color: #fff; 
            font-family: 'Syne', sans-serif; 
            overflow-x: hidden; 
            overflow-y: auto;
        }
        
        header { 
            position: fixed; top: 0; left: 0; width: 100%; 
            padding: 35px 0; z-index: 999; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0) 100%); 
            pointer-events: none; 
            display: flex; justify-content: center;
        }

        .header-inner {
            display: inline-flex;
            flex-direction: column;
            align-items: stretch;
            pointer-events: auto;
        }
        
        .glitch { 
            font-family: 'Syne', sans-serif;
            font-size: 2.2rem; 
            font-weight: 800; 
            text-transform: uppercase; 
            white-space: nowrap;
            cursor: pointer; 
            margin: 0 0 12px 0; 
            color: #fff; 
            text-shadow: 0 4px 10px rgba(0,0,0,0.8);
            letter-spacing: 2px;
            text-align: center;
        }
        .glitch:hover { animation: glitch 0.3s infinite; }
        @keyframes glitch { 
            0% { color: #fff; text-shadow: 2px 0 red; } 
            50% { color: #fff; text-shadow: -2px 0 cyan; } 
            100% { color: #fff; text-shadow: 2px 0 red; } 
        }

        nav {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }

        nav a, nav a:visited { 
            font-family: 'Syne', sans-serif;
            color: #ffffff; 
            text-decoration: none; 
            font-size: 1.05rem; 
            font-weight: 800; 
            transition: color 0.3s ease; 
            text-shadow: 0 2px 5px rgba(0,0,0,0.8); 
        }
        nav a:hover { color: #ff0000; }
        nav a.active { color: #777777; }

        .mosaic-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 0;
            width: 100%; 
            margin: 0; 
            padding: 150px 0 0 0;
            box-sizing: border-box;
        }
        
        .item { 
            position: relative; 
            width: 100%;
            padding-bottom: 56.25%;
            background-color: #050505; 
        }
        
        .item iframe { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block;
        }

        @media (max-width: 900px) { 
            .mosaic-grid { 
                grid-template-columns: 1fr; 
                padding: 130px 0 0 0; 
            }
            .glitch { font-size: 1.4rem; }
            nav a, nav a:visited { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <h1 class="glitch" onclick="window.location.href='index.html'">THOMAS MARCUCCI</h1>
            <nav>
                <a href="stills.html">STILLS</a>
                <a href="work.html" class="active">WORK</a>
                <a href="about.html">ABOUT</a>
                <a href="contact.html">CONTACT</a>
            </nav>
        </div>
    </header>

    <div class="mosaic-grid">
        <div class="item"><iframe src="https://player.vimeo.com/video/1222482193?title=0&byline=0&portrait=0" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
        <div class="item"><iframe src="https://player.vimeo.com/video/1208359948?title=0&byline=0&portrait=0" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
        <div class="item"><iframe src="https://player.vimeo.com/video/1236164449?title=0&byline=0&portrait=0" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
        <div class="item"><iframe src="https://player.vimeo.com/video/1208359248?title=0&byline=0&portrait=0" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
        <div class="item"><iframe src="https://player.vimeo.com/video/1208359340?title=0&byline=0&portrait=0" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
        <div class="item"><iframe src="https://player.vimeo.com/video/1222482239?title=0&byline=0&portrait=0" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
        <div class="item"><iframe src="https://player.vimeo.com/video/1222492930?title=0&byline=0&portrait=0" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
        <div class="item"><iframe src="https://player.vimeo.com/video/1208359283?title=0&byline=0&portrait=0" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
    </div>

</body>
</html>
