<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Portfolio | Work</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;800&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; padding: 0; 
            background: #000; color: #fff; 
            font-family: 'Syne', sans-serif; 
            min-height: 100vh;
            overflow-x: hidden; 
        }
        
        header { 
            position: fixed; 
            top: 0; left: 0; width: 100%; text-align: center; padding: 40px 0; z-index: 999; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%); pointer-events: none; 
        }
        .glitch, nav a { pointer-events: auto; } 
        
        .glitch { font-family: 'Syne', sans-serif; font-size: 5em; font-weight: 800; text-transform: uppercase; cursor: pointer; margin: 0 0 10px 0; color: #fff; text-shadow: 0 4px 10px rgba(0,0,0,0.8); }
        .glitch:hover { animation: glitch 0.3s infinite; }
        @keyframes glitch { 0% { color: #fff; text-shadow: 2px 0 red; } 50% { color: #fff; text-shadow: -2px 0 cyan; } 100% { color: #fff; text-shadow: 2px 0 red; } }
        
        nav a { color: white; text-decoration: none; margin: 0 15px; font-size: 1.2rem; font-weight: 800; transition: 0.3s; font-family: 'Syne', sans-serif; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }
        nav a:hover { color: #ff0000; }

        .mosaic-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 0; /* Colle les lecteurs entre eux */
            width: 100%; /* Prend toute la largeur de l'écran */
            margin: 0; 
            padding: 220px 0 0 0; /* Baisse les vidéos pour dégager le menu, aucun espace sur les côtés */
            box-sizing: border-box;
        }
        
        .item { 
            position: relative; 
            width: 100%;
            padding-bottom: 56.25%; /* Force le ratio 16:9 strict */
            background-color: #050505; 
        }
        
        .item iframe { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block;
        }

        @media (max-width: 900px) { 
            .mosaic-grid { 
                grid-template-columns: 1fr; 
                padding: 180px 0 0 0; /* Dégage le menu sur mobile */
            } 
            .glitch { font-size: 3em; } 
        }
    </style>
</head>
