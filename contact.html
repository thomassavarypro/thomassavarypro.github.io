<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Thomas Savary | Contact</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;800&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            font-family: 'Syne', sans-serif; 
            background: #000; color: #fff;
            overflow: hidden; 
        }
        
        header { 
            position: fixed; top: 0; left: 0; width: 100%; 
            padding: 35px 0; z-index: 999; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%); 
            pointer-events: none; 
            display: flex; justify-content: center;
        }

        .header-inner {
            display: inline-flex;
            flex-direction: column;
            align-items: stretch;
            pointer-events: auto;
        }
        
        .glitch { 
            font-family: 'Syne', sans-serif;
            font-size: 2.2rem; 
            font-weight: 800; 
            text-transform: uppercase; 
            white-space: nowrap;
            cursor: pointer; 
            margin: 0 0 12px 0; 
            color: #fff; 
            text-shadow: 0 4px 10px rgba(0,0,0,0.8);
            letter-spacing: 2px;
            text-align: center;
        }
        .glitch:hover { animation: glitch 0.3s infinite; }
        @keyframes glitch { 
            0% { color: #fff; text-shadow: 2px 0 red; } 
            50% { color: #fff; text-shadow: -2px 0 cyan; } 
            100% { color: #fff; text-shadow: 2px 0 red; } 
        }

        nav {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }

        nav a, nav a:visited { 
            font-family: 'Syne', sans-serif;
            color: #ffffff; 
            text-decoration: none; 
            font-size: 1.05rem; 
            font-weight: 800; 
            transition: color 0.3s ease; 
            text-shadow: 0 2px 5px rgba(0,0,0,0.8); 
        }
        nav a:hover { color: #ff0000; }
        nav a.active { color: #777777; }

        .bg-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; filter: brightness(0.4); }
        
        .contact-content { 
            position: relative; z-index: 10; height: 100%; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            gap: 18px; pointer-events: none; 
        }
        .contact-content a, .contact-content a:visited { 
            font-family: 'Syne', sans-serif;
            color: #ffffff; font-size: 1.5rem; font-weight: 400; 
            letter-spacing: 2px; text-decoration: none; 
            transition: color 0.3s ease; pointer-events: auto; 
        }
        .contact-content a:hover { color: #ff0000; }
        
        @media (max-width: 768px) { 
            .glitch { font-size: 1.5rem; }
            nav a, nav a:visited { font-size: 0.85rem; }
            .contact-content a, .contact-content a:visited { font-size: 1.1rem; } 
        }
    </style>
</head>
<body>

    <video autoplay loop muted playsinline class="bg-video">
        <source src="video_contact.mp4" type="video/mp4">
    </video>

    <header>
        <div class="header-inner">
            <h1 class="glitch" onclick="window.location.href='index.html'">THOMAS SAVARY</h1>
            <nav>
                <a href="stills.html">STILLS</a>
                <a href="work.html">WORK</a>
                <a href="about.html">ABOUT</a>
                <a href="contact.html" class="active">CONTACT</a>
            </nav>
        </div>
    </header>

    <div class="contact-content">
        <a href="mailto:thomassavarypro@gmail.com">thomassavarypro@gmail.com</a>
        <a href="tel:+33617204682">06 17 20 46 82</a>
    </div>

</body>
</html>
