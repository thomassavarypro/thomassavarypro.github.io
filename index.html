<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Portfolio | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;800&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; font-family: 'Syne', sans-serif; }
        
        header { 
            position: absolute; top: 0; left: 0; width: 100%; text-align: center; padding: 40px 0; z-index: 999; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%); pointer-events: none; 
        }
        .glitch, nav a { pointer-events: auto; } 
        
        .glitch { font-size: 5em; font-weight: 800; text-transform: uppercase; cursor: pointer; margin: 0 0 10px 0; color: #fff; text-shadow: 0 4px 10px rgba(0,0,0,0.8); }
        .glitch:hover { animation: glitch 0.3s infinite; }
        @keyframes glitch { 0% { color: #fff; text-shadow: 2px 0 red; } 50% { color: #fff; text-shadow: -2px 0 cyan; } 100% { color: #fff; text-shadow: 2px 0 red; } }
        
        nav a { color: white; text-decoration: none; margin: 0 15px; font-size: 1.2rem; font-weight: 800; transition: 0.3s; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }
        nav a:hover { color: #ff0000; }

        .video-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;
        }
        .video-container iframe {
            width: 100vw; height: 56.25vw; min-height: 100vh; min-width: 177.77vh; 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: none;
        }
        
        @media (max-width: 768px) { .glitch { font-size: 3em; } }
    </style>
</head>
<body>

    <div class="video-container">
        <iframe src="https://player.vimeo.com/video/1222492862?background=1&autoplay=1&loop=1&muted=1" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>

    <header>
        <h1 class="glitch" onclick="window.location.href='index.html'">PORTFOLIO</h1>
        <nav>
            <a href="stills.html">STILLS</a>
            <a href="work.html">WORK</a>
            <a href="about.html">ABOUT</a>
            <a href="contact.html">CONTACT</a>
        </nav>
    </header>

</body>
</html>
